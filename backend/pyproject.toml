[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "notification-backend"
version = "0.1.0"
description = "FastAPI backend for the notification challenge."
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.18.4,<2.0",
  "fastapi>=0.136.0,<1.0",
  "psycopg[binary]>=3.3.3,<4.0",
  "pydantic-settings>=2.13.1,<3.0",
  "sqlalchemy>=2.0.49,<3.0",
  "uvicorn[standard]>=0.44.0,<1.0",
]

[dependency-groups]
dev = [
  "pyright>=1.1.408,<2.0",
  "pytest>=9.0.3,<10.0",
  "pytest-cov>=7.1.0,<8.0",
  "ruff>=0.15.11,<1.0",
]

[tool.pyright]
include = ["app"]
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.hatch.build.targets.wheel]
packages = ["app"]
